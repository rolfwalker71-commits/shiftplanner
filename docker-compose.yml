services:
  schichtklar:
    build: .
    image: ghcr.io/rolfwalker71-commits/shiftplanner:latest
    ports:
      - "8080:8080"
    environment:
      API_PORT: "8080"
      APP_URL: https://schichten.rolfwalker.ch
      DEMO_MODE: ${DEMO_MODE:-false}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production-please}
      DATABASE_URL: file:../data/schichtklar.db
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: https://schichten.rolfwalker.ch/api/auth/google/callback
      CALDAV_SERVER_URL: ${CALDAV_SERVER_URL:-https://webmail.your-server.de}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-valentyna@valentoys.ch}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-image-1}
      TZ: Europe/Zurich
    volumes:
      - schichtklar-data:/app/backend/data
      - schichtklar-uploads:/app/backend/uploads
    restart: unless-stopped

volumes:
  schichtklar-data:
  schichtklar-uploads:
